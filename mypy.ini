[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True
show_error_codes = True
mypy_path = stubs

# Module-specific overrides for strict checking
[mypy-libs.*]
strict = True
disallow_any_generics = True
disallow_untyped_calls = True

[mypy-orchestrator.*]
strict = True
disallow_any_generics = True
disallow_untyped_calls = True

# External dependencies that may not have stubs
[mypy-driftpy.*]
ignore_missing_imports = True

[mypy-anchorpy.*]
ignore_missing_imports = True

[mypy-solders.*]
ignore_missing_imports = True

[mypy-solana.*]
ignore_missing_imports = True

[mypy-httpx.*]
ignore_missing_imports = True

[mypy-websockets.*]
ignore_missing_imports = True

[mypy-prometheus_client.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True

[mypy-dotenv.*]
ignore_missing_imports = True

# Test modules can be less strict
[mypy-tests.*]
strict = False
disallow_untyped_defs = False
disallow_incomplete_defs = False

# Scripts and utilities can be less strict
[mypy-*.py]
strict = False
disallow_untyped_defs = False
disallow_incomplete_defs = False

# Specific file overrides for gradual adoption
[mypy-run_*.py]
strict = False

[mypy-launch_*.py]
strict = False

[mypy-test_*.py]
strict = False
