# Default configuration for the Swift MM JIT bot
# Generated for runtime toggling support between Python legacy JIT and TS sidecar backends.

name: jit
sub_account: 0
market: "SOL-PERP"
order_size: 0.2
max_orders_per_side: 1
price_tolerance: 0.01
spread_bps: 8
loop_secs: 0.9
max_order_size_usd: 5000.0
max_daily_loss_usd: 5000.0
swift_ws_enabled: true
swift_websocket_url: "${SWIFT_WS_URL:wss://swift.drift.trade/ws}"
swift_api_key: "${SWIFT_API_KEY:}"
wallet_file: "${JIT_WALLET_PATH:.devnet_wallet.json}"

jitter:
  jitter_enabled: ${JITTER_ENABLED:false}
  jitter_backend: "${JITTER_BACKEND:ts-sidecar}"
  jitter_mode: "${JITTER_MODE:shotgun}"
  auction_ignore_swift: ${AUCTION_IGNORE_SWIFT:true}
