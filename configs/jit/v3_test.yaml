# JIT Engine v3 Test Configuration
# Minimal configuration for testing the new JIT v3 engine with mock drivers

# Driver configuration
driver: swift  # Use SwiftSidecarDriver for testing

# Basic settings  
loop_secs: 1.0
market: "SOL-PERP"

# Swift configuration
swift:
  forward_base: ${SWIFT_FORWARD_BASE:}  # Optional Swift forwarding

# JIT Engine v3 Configuration
jit:
  # Basic sizing
  base_size: 0.1
  max_position: 5.0
  
  # Spread settings
  min_spread_bps: 1.0
  max_spread_bps: 50.0
  
  # Microprice calculation
  microprice:
    enabled: true
  
  # OBI weights for different volatility regimes
  obi_weights:
    low: 0.8      # High microprice weight in low vol
    normal: 0.6   # Balanced approach
    high: 0.4     # Conservative in high vol
  
  # Toxicity-based spread skew
  skew:
    enabled: true
    toxicity_threshold: 0.7
    skew_multiplier: 1.5
  
  # Enhanced cancel/replace
  cancel_replace_v2:
    enabled: true
    min_lifetime_ms: 250
    price_move_bps: 1.5

# Logging
log_level: INFO


